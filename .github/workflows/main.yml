name: Build Kernel Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Kernel Driver Project
      run: |
        $proj = Get-ChildItem -Recurse -Filter "*.vcxproj" | Where-Object { $_.FullName -like "*Kernel*" } | Select-Object -First 1
        if (-not $proj) {
            $proj = Get-ChildItem -Recurse -Filter "*.vcxproj" | Select-Object -First 1
        }
        Write-Host "Building project: $($proj.FullName)"
        msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:EnableInf2Cat=false /p:TargetPlatformVersion=10.0.26100.0 /p:WindowsTargetPlatformVersion=10.0.26100.0

    - name: Upload Driver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spoofer-driver
        path: |
          **/*.sys
